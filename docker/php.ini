; benchmark-optimised PHP settings
memory_limit = -1
max_execution_time = 0
date.timezone = UTC

; OPcache + JIT — required for representative numbers
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
; max 128M on AArch64 (PHP 8.4)
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; FFI — needed by B01_Mmap
ffi.enable = true

; Honest measurement: never silently swallow errors
error_reporting = E_ALL
display_errors = stderr
display_startup_errors = 1
log_errors = 1

; GC tuning — keep defaults; tests measure gc_status()
zend.assertions = -1
